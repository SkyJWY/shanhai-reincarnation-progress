<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>山海轮回 · 山野与古寺</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="adventure.css" />
    <link rel="stylesheet" href="mobile-layout.css" />
  </head>
  <body>
    <canvas id="world"></canvas>
    <header>
      <div>
        <small>山海轮回 / ADVENTURE PROTOTYPE 0.4.1</small>
        <h1>山野与古寺</h1>
        <p>竹影深处，试剑问道。</p>
      </div>
      <a href="../">开发进度 ↗</a>
    </header>
    <aside>
      <span id="status">试炼开始</span>
      <div class="bar"><i id="health"></i></div>
      <span id="stats"></span>
    </aside>
    <nav id="adventureTools">
      <button id="bagButton">行囊 I</button><button id="saveButton">保存</button
      ><button id="interactButton">交互 T</button
      ><small id="saveStatus">本地存档</small>
    </nav>
    <div id="questHUD"></div>
    <dialog id="adventurePanel">
      <header>
        <h2 id="adventureTitle"></h2>
        <button id="adventureClose" aria-label="关闭行囊">×</button>
      </header>
      <div id="adventureBody" class="adventure-scroll"></div>
    </dialog>
    <div id="toast">右键移动或攻击 · QWER 技能 · DF 通用技能</div>
    <footer>
      <label id="castSetting"
        ><input id="quickCast" type="checkbox" />
        快捷施法（按住瞄准，松键释放）</label
      >
      <div id="skills"></div>
      <p>
        右键移动 / 攻击 · 左键怪物攻击 · QWER 技能 · DF 通用 · A 攻击移动 · S
        停止 · H 待命 · Y 镜头锁定 · 空格回到角色
      </p>
      <small>规则生成探索原型 · 无实时 AI / 云存档 · 美术为程序绘制占位</small>
    </footer>
    <div id="stick"><b></b></div>
    <button id="attack"><span>剑</span>普攻</button>
    <div id="cancelCast" aria-live="polite">拖入取消</div>
    <button id="pauseGame" aria-label="暂停游戏">Ⅱ</button>
    <div id="rotateHint">
      <div>
        <div class="phone-icon">▯ ↻</div>
        <h2>横屏，开启试炼</h2>
        <p>请将手机横向握持<br />左手移动 · 右手施法</p>
        <small>竖屏期间战斗与冷却已冻结</small>
      </div>
    </div>
    <dialog id="modal">
      <h2 id="modalTitle">试炼结束</h2>
      <p id="result"></p>
      <button id="restart">重新试炼</button><button id="resume">继续</button>
    </dialog>
    <script type="module" src="viewport-guard.mjs"></script>
    <script type="module" src="game.mjs"></script>
  </body>
</html>
