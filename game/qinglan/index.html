<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>青岚渡 · 在线试玩</title><link rel="icon" href="index.icon.png"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#192d26;color:#fff;font-family:system-ui,sans-serif}canvas{display:block;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#14271d55,#14271dbb),url(loading.webp) center/cover;z-index:10}.card{width:min(90vw,440px);padding:26px;border:1px solid #dfd2a880;background:#172d26ed;border-radius:18px;box-shadow:0 12px 50px #0004}h1{font-size:29px;margin:0 0 10px;color:#eee3bf}p{line-height:1.6;margin:10px 0;font-size:14px}.muted{font-size:12px;color:#c7d0ba}progress{width:100%;height:12px;accent-color:#d8bc76}#retry{display:none;border:1px solid #d8bc76;background:#34594a;color:#fff;padding:12px 22px;border-radius:8px;min-height:44px}#phase{min-height:44px}#preview{color:#d0d6c0;font-size:12px}
</style></head><body><canvas id="canvas"></canvas><section id="loading"><div class="card"><div id="preview">场景加载预览</div><h1>青岚渡</h1><p id="phase">准备游戏…</p><progress id="progress" max="100"></progress><p id="detail" class="muted">首次需要下载引擎；后续优先使用本机缓存。</p><p class="muted">移动端点地行走 · 电脑 WASD<br>首次下载完成后，仍需片刻初始化。</p><button id="retry" onclick="location.reload()">重新尝试</button></div></section><script>
window.__cacheHits=[];window.__loadStarted=performance.now();
const config={"executable": "index", "mainPack": "scene-1d47235c336e49a8.pck", "canvasResizePolicy": 2, "focusCanvas": true, "fileSizes": {"index.wasm": 39514754, "scene-1d47235c336e49a8.pck": 1151308}, "args": [], "gdextensionLibs": []},phase=document.querySelector('#phase'),bar=document.querySelector('#progress'),detail=document.querySelector('#detail');
async function cacheReady(){
 if(!('serviceWorker' in navigator))return;
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='qinglan-cache-hit')window.__cacheHits.push(e.data.file);});
 try{await navigator.serviceWorker.register('./qinglan-sw.js',{scope:'./',updateViaCache:'none'});await navigator.serviceWorker.ready;
 if(!navigator.serviceWorker.controller)await new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true}));}catch{}
}
async function boot(){
 await Promise.race([cacheReady(),new Promise(r=>setTimeout(r,1800))]);
 phase.textContent='正在载入引擎和场景…';
 await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='index.js?v=33c94cb3175f3333';s.onload=resolve;s.onerror=()=>reject(Error('引擎脚本下载失败，请检查网络后重试。'));document.body.appendChild(s);});
 const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw Error('当前浏览器缺少 '+missing.join(', ')+'，请尝试系统浏览器。');
 const engine=new Engine(config);
 await engine.startGame({onProgress:(current,total)=>{
  if(total>0&&current>0){const pct=Math.min(100,Math.floor(current/total*100));bar.value=pct;phase.textContent=pct>=100?'下载完成，正在初始化游戏…':'正在载入引擎和场景：'+pct+'%';}
  detail.textContent=window.__cacheHits.length?'已读取本机缓存；正在准备游戏。':'首次加载需要网络下载，浏览器允许时会自动缓存。';
 }});
 window.__loadReadyMs=performance.now()-window.__loadStarted;document.querySelector('#loading').remove();
}
boot().catch(error=>{phase.textContent='加载未完成';detail.textContent=error.message;document.querySelector('#retry').style.display='inline-block';console.error(error);});
</script></body></html>
